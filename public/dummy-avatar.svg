<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2744" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="240" height="240" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Accent -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="4 4" />
  
  <!-- Head & Shoulder Silhouette -->
  <g fill="url(#avatarGrad)" opacity="0.85">
    <!-- Head -->
    <circle cx="120" cy="85" r="38" />
    <!-- Shoulders -->
    <path d="M50 205 C50 155, 80 140, 120 140 C160 140, 190 155, 190 205 Z" />
  </g>
  
  <!-- Inner Rim Badge -->
  <circle cx="120" cy="120" r="115" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.1" />
  

</svg>
