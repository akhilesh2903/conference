<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="100%" height="100%">
  <defs>
    <linearGradient id="academicBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="academicSilhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  
  <!-- Subtle light background matching studio portrait backgrounds -->
  <rect width="240" height="300" fill="url(#academicBg)" />
  
  <!-- Subtle halo ring -->
  <circle cx="120" cy="115" r="70" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  
  <!-- Academic Head & Shoulders Silhouette -->
  <g fill="url(#academicSilhouette)">
    <!-- Head -->
    <circle cx="120" cy="105" r="42" />
    <!-- Neck -->
    <path d="M108 142 h24 v22 h-24 z" opacity="0.9" />
    <!-- Shoulders & Torso -->
    <path d="M42 270 C42 195, 78 170, 120 170 C162 170, 198 195, 198 270 Z" />
  </g>
</svg>
